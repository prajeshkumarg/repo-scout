name: evals

# Only when retrieval could actually have changed. Re-measuring recall
# after a README edit costs twenty minutes and proves nothing; the code
# below is the code that can move the number. Also runnable by hand from
# the Actions tab when you want the number for its own sake.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "backend/chunking/**"
      - "backend/ingest/**"
      - "backend/tools/**"
      - "backend/embedding.py"
      - "backend/config.py"
      - "backend/db/schema.py"
      - "evals/**"
      - ".github/workflows/evals.yml"

jobs:
  evals:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: scout
          POSTGRES_PASSWORD: scout
          POSTGRES_DB: repo_scout
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U scout -d repo_scout"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        run: uv sync
        working-directory: backend

      - name: Cache embedding model
        uses: actions/cache@v4
        with:
          path: ~/.cache
          key: fastembed-models-v1

      - name: Run eval suite (fails on recall regression)
        run: uv run python ../evals/run.py --check-regression
        working-directory: backend
